name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check whether version is already published
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          lookup_error="${RUNNER_TEMP}/npm-view-error.log"

          set +e
          published_version="$(
            npm view "${package_name}@${package_version}" version \
              --registry=https://registry.npmjs.org \
              2>"$lookup_error"
          )"
          lookup_status=$?
          set -e

          if [[ "$lookup_status" -eq 0 ]]; then
            if [[ "$published_version" != "$package_version" ]]; then
              printf 'Registry returned unexpected version: %s\n' \
                "$published_version" >&2
              exit 1
            fi

            printf '%s@%s is already published.\n' \
              "$package_name" "$package_version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eq '(^|[[:space:]])(code[[:space:]]+)?E404([[:space:]]|$)' \
            "$lookup_error"; then
            printf '%s@%s is not published yet.\n' \
              "$package_name" "$package_version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$lookup_error" >&2
          exit "$lookup_status"

      - name: Upgrade npm for OIDC trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Run full test suite
        if: steps.release.outputs.publish == 'true'
        run: npm test

      - name: Publish to npm with provenance
        if: steps.release.outputs.publish == 'true'
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

  github-release:
    name: Create GitHub Release
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          notes="$(
            awk -v version="$version" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { lines[++count] = $0 }
              END {
                while (count > 0 && lines[count] ~ /^[[:space:]]*$/) count--
                first = 1
                while (first <= count && lines[first] ~ /^[[:space:]]*$/) first++
                for (i = first; i <= count; i++) print lines[i]
              }
            ' CHANGELOG.md
          )"

          if [[ -z "$notes" ]]; then
            printf 'CHANGELOG.md has no release notes for version %s.\n' \
              "$version" >&2
            exit 1
          fi

          printf '%s\n' "$notes" | tee "$notes_file"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.release.outputs.version }}"
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
