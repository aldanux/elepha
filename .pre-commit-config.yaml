#default_install_hook_types: [pre-commit, commit-msg]
#default_stages: [pre-commit]

repos:
  # - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    # rev: v9.20.0
    # hooks:
      #- id: commitlint
      #  stages: [commit-msg]
      #  additional_dependencies: ["@commitlint/config-conventional"]
  - repo: local
    hooks:
      - id: biome
        name: Biome (format + lint)
        entry: npx biome check --write --no-errors-on-unmatched --colors=off
        language: system
        stages: [pre-commit]
        types: [text]
        pass_filenames: true
      - id: typecheck-tests
        name: TypeScript (src + tests)
        entry: npm run typecheck:tests
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: vitest
        name: Vitest (Behavior)
        entry: npx vitest run --silent --reporter=dot
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
